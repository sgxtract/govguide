<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .box { fill: #201914; }
    .tick { stroke: #f9f6f1; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #ebe7e0; }
      .tick { stroke: #161310; }
    }
  </style>
  <!-- A ticked box: the "What to bring" checklist, GovGuide's signature. -->
  <rect class="box" x="2" y="2" width="28" height="28" rx="3"/>
  <polyline class="tick" points="8.5 16.5 13.5 21.5 23.5 10.5" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>