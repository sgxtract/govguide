# National agency, shared by every city. File name = slug.
name: Philippine Statistics Authority
acronym: PSA
level: national
description: Keeps the national civil registry and issues certified copies of birth, marriage and death certificates. Also runs the Philippine Identification System (PhilSys).
website: "https://psa.gov.ph"
portals:
  - label: CRS Appointment System (birth, marriage and death certificates)
    url: "https://appointment.psa.gov.ph"
  - label: PhilSys (National ID)
    url: "https://philsys.gov.ph"
keywords:
  - NSO
  - civil registry
  - PhilSys
  - national ID
