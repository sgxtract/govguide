# Public holidays, so offices show "Closed today" instead of "Open now".
# Copy the dates from the official proclamation for the year (regular
# holidays and special non-working days). This file is shared by every city,
# so national holidays only: a city-only holiday would close every city's offices.
# One entry per date, e.g.
# - date: "2027-01-01"
#   name: New Year's Day
#
# 2026: Proclamation No. 1006 (s. 2025), plus No. 1189 (Eid'l Fitr) and
# No. 1264 (Eid'l Adha), s. 2026. Texts at lawphil.net/executive/proc/.
# Not listed: 25 February (EDSA anniversary) is a special *working* day.

