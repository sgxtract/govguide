scope: national
status: draft
title: Apply for a new passport
summary: Apply for your first Philippine passport at a DFA consular office.
keywords:
  - passport
  - pasaporte
  - DFA appointment
category: ids-and-documents
agency: dfa

whoCanApply:
  - Filipino citizens applying for their first passport
  - "Minors (below 18) apply with an accompanying adult, who signs the form as parent or legal guardian. [VERIFY] documents minors need"

requirements:
  - label: Confirmed online appointment
    form: original
    notes: You don't need one if you can use the Courtesy Lane.
  - label: Passport application form, filled out and signed
    form: original
    notes: Leave no space blank; write N/A where it doesn't apply. Download it from consular.dfa.gov.ph.
  - label: PSA birth certificate (Certificate of Live Birth) on security paper
    form: original-and-photocopy
    copies: 1
    notes: If the PSA copy is unclear or can't be read, also bring the copy from your Local Civil Registrar.
  - label: PSA marriage certificate on security paper, or Report of Marriage
    form: original-and-photocopy
    copies: 1
    notes: Only for married women using their husband's last name. Not needed if you keep your maiden name.
  - label: One valid ID
    form: original-and-photocopy
    copies: 1
    notes: Your National ID (PhilID or ePhilID), or one of the other IDs listed. It must be readable, not tampered with, and match the details on your other documents.
    alternatives:
      - National ID card (PhilID)
      - ePhilID (paper National ID)
      - Digital National ID, printed. You'll also be asked to open it on national-id.gov.ph or the eGovPH app.
      - SSS card
      - UMID card
      - LTO driver's license (a student permit only if it's a card)
      - BLTO driver's license card, issued 2022 onwards
      - PRC ID
      - OWWA e-Card
      - COMELEC voter's ID, or voter's certificate from the COMELEC main office in Intramuros, Manila
      - PNP permit to carry firearms outside residence
      - Senior citizen ID
      - Airman license, issued August 2016 onwards
      - Philippine Postal ID
      - MARINA Seafarer's Record Book (SRB) or Seafarer's Identity Document (SID), issued February 2020 onwards
      - School ID with your Certificate of Registration

