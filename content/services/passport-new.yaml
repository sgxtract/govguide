tips:
  - If you miss your appointment, or your application is denied for missing documents, your payment is forfeited and not refunded.
  - You can only hold one Philippine passport at a time.
  - The DFA may ask for more documents if it needs them.
  - Only book at passport.gov.ph, the DFA's own appointment site.

faqs:
  - question: Can I walk in without an appointment?
    answer: "Only if you can use the Courtesy Lane. Everyone else needs a confirmed online appointment. [VERIFY] who can use the Courtesy Lane, from https://consular.dfa.gov.ph/courtesy-lane-eligibility/"
  - question: What if my birth certificate was registered late or has errors?
    answer: You'll need more documents. The DFA lists them case by case under "Supporting documents" on its adult new application page, including late registration, missing data, misspelled names or clerical errors, a name changed by court order, details that don't match across documents, an unreadable PSA copy, and no PSA birth certificate at all.

