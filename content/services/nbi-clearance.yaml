# DRAFT. Checked against the NBI Citizen's Charter Handbook 2025, 1st Edition: NBI Clearance
# Center (regional and district offices) services 1, 4 and 5 (pp. 71-84). Review, then publish.
scope: national
status: draft
title: Get an NBI clearance
summary: Get an NBI clearance for employment, travel or other applications.
keywords:
  - NBI
  - clearance
  - trabaho
category: ids-and-documents
agency: nbi

whoCanApply:
  - Filipinos and foreigners who need an NBI clearance for work, travel or immigration, or for permits and licenses
  - First-time jobseekers get it free with a barangay certificate (Republic Act 11261)

requirements:
  - label: Paid reference number from the online application
    form: original
    notes: Register and pay at clearance.nbi.gov.ph before you go. First-time jobseekers register on the "First Time Job Seeker" portal there instead and don't pay.
  - label: Your National ID (PhilSys ID), or any two valid IDs
    form: original
    alternatives:
      - TIN ID
      - Driver's license
      - Passport
      - UMID (SSS or GSIS)
      - PhilHealth ID
      - Pag-IBIG (HDMF) loyalty card
      - Postal ID
      - PRC license
      - Voter's ID or certification of registration
      - PSA birth certificate (authenticated)
      - School ID with your current registration card
      - Government employee ID
      - MARINA ID or Seaman's book
      - IBP card
      - Senior citizen's, PWD or solo parent ID
      - Security guard license
      - DSWD foundling certificate, or Malacañang certification of indigenous or tribal membership
  - label: Barangay certificate and Oath of Undertaking
    form: original
    notes: First-time jobseekers only. From your barangay, stating you're a first-time jobseeker and have lived there for at least 6 months. First-time jobseekers can't use a UMID, Pag-IBIG card, IBP card, government employee ID or senior citizen's ID as one of their two IDs.
  - label: Valid passport
    form: original-and-photocopy
    copies: 1
    notes: Foreigners only. New foreign applicants can only apply at the NBI Main Office in Manila or an NBI regional or district office.

steps:
  - title: Register online and get a reference number
    where: "Online: clearance.nbi.gov.ph"
    duration: About 10 minutes
  - title: Pay the clearance fee
    where: An authorized e-payment channel, such as GCash, 7-Eleven or Bayad Center
    details: First-time jobseekers skip this step.
    duration: About 2 minutes
  - title: Have your photo, fingerprints and signature taken
    where: Biometrics window, NBI clearance center, on your appointment day
    duration: About 3 minutes
  - title: Get your NBI clearance
    where: Releasing window
    details: Printed on the spot if you have no "hit". With a hit, you come back on a scheduled date, about 15 working days later.
    duration: Under 1 minute

fees:
  - label: Clearance application
    amount: 130
    notes: Free for first-time jobseekers.
  - label: E-payment convenience fee
    amount: 30

processingTime: About 15 minutes at the clearance center with no hit; about 15 working days with a hit.

online:
  - label: NBI Clearance online
    url: "https://clearance.nbi.gov.ph"
    whatYouCanDo: Register, choose your appointment, and get a reference number to pay. First-time jobseekers use the "First Time Job Seeker" portal here.

faqs:
  - question: What does it mean to have a "hit"?
    answer: Your name matched a record the NBI has to check. You come back on a scheduled date, about 15 working days later, and some applicants are interviewed at the Quality Control window before their clearance is printed.

related:
  - police-clearance
  - get-a-tin

