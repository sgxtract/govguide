scope: national
status: draft
title: Get a new driver's license
summary: Apply for your first non-professional driver's license at the LTO.
keywords:
  - drivers license
  - driving license
  - lisensya
  - non-pro license
category: vehicles-and-driving
agency: lto

whoCanApply:
  - At least 17 years old (18 for foreigners)
  - Can read and write in Filipino and/or English
  - Has held a Student-Driver's Permit for at least one month
  - Has passed the Practical Driving Course (PDC) from the LTO Driver's Education Center, an LTO-accredited driving school, or an LTO-accredited TESDA training center
  - Physically and mentally fit to drive
  - Has no unsettled traffic violations

requirements:
  - label: Application for Permits and Licenses (APL) form, filled out
    form: original
    notes: The Client Service Officer can give you one at the office. If you're employed, you also need your Tax Identification Number (TIN).
  - label: Medical certificate from an LTO-accredited clinic
    form: original-and-photocopy
    copies: 1
    notes: The clinic sends it to the LTO electronically. Show the original and hand in the photocopy.
  - label: Practical Driving Course (PDC) certificate
    form: original-and-photocopy
    copies: 1
    notes: Your school also sends it to the LTO electronically. Show the original and hand in the photocopy.
  - label: Your Student-Driver's Permit
    form: original
    notes: It must still be valid.
  - label: Parent's or guardian's consent
    form: original
    notes: Only if you're 17. Bring it with your parent's or guardian's valid government ID with photo and signature.

steps:
  - title: Get a queue number
    where: Client Service Officer (CSO)
    details: Ask for an APL form here if you don't have one yet.
    duration: About 1 minute
  - title: Submit your form and requirements
    where: Client Service Officer (CSO) window, when your number is called
    details: The officer checks your documents, uploads them, and prints your application. Then wait to be called by the Cashier.
    duration: About 55 minutes
  - title: Pay the application fee
    where: Cashier
    details: Keep the Official Receipt.
    duration: About 25 minutes
  - title: Have your photo, fingerprints, and signature taken
    where: Client Service Officer (CSO) window
    details: You get a queue number for the exam.
    duration: About 20 minutes
  - title: Take the theoretical exam
    where: Examination area
    details: The exam is on a computer. You get your result right after.
    duration: About 1 hour 40 minutes
  - title: Take the practical driving test
    where: Driving Skills Area
    details: Only if you passed the theoretical exam.
    duration: About 1 hour 20 minutes
  - title: Pay the driver's license fee
    where: Cashier
    details: Only if you passed the practical test. Keep the Official Receipt.
    duration: About 25 minutes
  - title: Get your driver's license card
    where: Releasing Area
    details: Show your Official Receipt at the Client Service Officer window. Your card is printed the same day. Sign the logsheet and scan your fingerprint to claim it.
    duration: About 25 minutes

fees:
  - label: Application fee
    amount: 100
    notes: Paid again if you retake the practical test.
  - label: Driver's license fee
    amount: 585
    notes: Paid only after you pass the practical test.

processingTime: About 5 hours 38 minutes in one visit, if you pass both exams.

tips:
  - The LTO pledges to serve everyone already inside the office before closing time, including during the noon break.

faqs:
  - question: What if I fail the theoretical exam?
    answer: You can apply again the next working day, or any day you choose, within two years of the date your Student-Driver's Permit was issued.
  - question: What if I fail the practical test?
    answer: You can retake it 7 calendar days after your last practical test, within two years of the date your Student-Driver's Permit was issued. You pay the ₱100 application fee again.

related:
  - vehicle-registration-renewal

