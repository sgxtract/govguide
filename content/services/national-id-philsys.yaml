# services 1 and 2) and philsys.gov.ph's registration process and supporting documents
# pages. Review, then publish.
scope: national
status: draft
title: Register for the national ID (PhilSys)
summary: Register for the Philippine Identification System and get your national ID.
keywords:
  - national ID
  - PhilID
  - PhilSys
  - ePhilID
category: ids-and-documents
agency: psa

whoCanApply:
  - Filipino citizens

requirements:
  - label: PhilSys Registration Form 1A, filled out in capital letters
    form: original
    notes: Get it at the registration center.
  - label: At least one identification document
    form: original
    notes: If your birth certificate and ID don't match, the birth certificate is followed.
    alternatives:
      - PSA birth certificate plus one government ID with your full name, front-facing photo, and signature or thumbmark
      - Philippine passport or ePassport
      - UMID card
      - LTO student permit or driver's license
      - "If you have none of these: other documents such as an LCRO birth certificate, PRC ID, SSS ID, PhilHealth ID, voter's ID, postal ID, TIN ID, senior citizen's ID, PWD ID, or NBI or police clearance (full list at philsys.gov.ph)"

steps:
  - title: Go to a registration center and submit your form and documents
    where: PhilSys registration center (PSA office, mall-based or LGU center)
    duration: About 6 minutes
  - title: Have your details checked and your fingerprints, irises and photo taken
    where: Registration Kit Operator
    duration: About 10 minutes
  - title: Review and confirm your information
    where: Registration Kit Operator
    duration: About 3 minutes
  - title: Get your transaction slip and your ePhilID
    where: Registration Kit Operator
    details: Keep the slip. Its transaction reference number (TRN) tracks your ID's delivery.
    duration: About 10 minutes
  - title: Receive your PhilID card by delivery
    where: Your address, through PHLPost
    details: Show your transaction slip or the ID you registered with, and sign the delivery receipt. Someone else can receive it with an authorization letter, your ID and theirs.
    duration: About 12 days in urban areas, 17 days in rural areas, or up to 62 days in remote areas

fees:
  - label: Registration
    amount: 0

processingTime: Registration takes under an hour; the PhilID card arrives in about 12 days (urban), 17 days (rural) or 62 days (remote areas).

tips:
  - Keep your transaction slip. Its TRN tracks your PhilID delivery and lets you get the ePhilID or the National ID in paper format.

faqs:
  - question: Can children register?
    answer: Yes. A child below five is registered with a parent or guardian, who brings their own ePhilID or PhilID, proof of relationship, and the child's birth certificate or another accepted document.

related:
  - psa-birth-certificate

